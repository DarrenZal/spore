  - claim: "A real participatory-coherence pilot needs typed objects — MapFeature, Lens, Observation, Claim/Question/Evidence, ConsentBoundary, Commitment — plus a lens-coverage requirement (≥2 lens types per contested feature; report 'insufficient lens coverage' rather than 'coherent' when a feature has one lens); and a consent-aware data-share that preserves local structure (n-ary relationships, consent/visibility fields)."
    location: "Section 6 (real-data requirements)"
    source:
      type: file
      ref: "/Users/darrenzal/projects/sheaf-explorer/src/knowledge/participatory-coherence-deployment-readiness.md"
      evidence: "Backstage source note §4 'Real-Data Readiness Checklist' enumerates Minimum Objects (MapFeature, Lens, Observation, Claim/Question/Evidence, ConsentBoundary, Commitment) + Minimum Fields; §5 'Lens-Coverage Requirements' states 'at least two lens types per contested feature' and the 'insufficient lens coverage' vs 'coherent' rule; §7 'Mehul / Data-Share Implication' states 'preserve typed, consent-aware local structure' incl. 'n-ary relationships, not only pairwise triples' and consent/visibility fields. Section 6 of the brief summarizes these by reference."
