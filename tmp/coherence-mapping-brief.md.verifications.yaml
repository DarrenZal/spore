  - claim: "The study engaged 43 participants from four stakeholder groups (environmental regulators, water industry practitioners, the farm advisor community, academics) across three catchments; the participatory exercise produced heat maps of perceived conflict and land use competition, with localised hotspots (flooding, abstraction, urbanisation) and landscape-scale issues (farming, forestry, energy production, tourism)."
    location: "Section 4"
    source:
      type: file
      ref: "/Users/darrenzal/Documents/Research/Papers/authors/stosch-kathleen/2022-catchment-scale-participatory-mapping/source.pdf"
      evidence: "Verbatim from the PDF abstract (pdfinfo Subject field): '...43 participants from four key land and water management stakeholder groups: environmental regulators, water industry practitioners, the farm advisor community, and academics. The participatory mapping exercise produced heat maps of perceived conflict and land use competition... Distinct, localised hotspots were identified in areas under pressure from flooding, abstraction, and urbanisation; as well as more dispersed issues of relevance at the landscape scale, such as from farming, forestry, energy production, and tourism.' pdftotext term counts: heat map 7, hotspot 15, landscape-scale 5."

  - claim: "Participants reported that conflicts often arise from 'a clear trade-off between two reasonable interests which are conflicting, hence making a \"win–win\" solution unlikely' (participant-reported, Discussion)."
    location: "Section 4"
    source:
      type: file
      ref: "/Users/darrenzal/Documents/Research/Papers/authors/stosch-kathleen/2022-catchment-scale-participatory-mapping/source.pdf"
      evidence: "Verbatim from pdftotext of source.pdf, lines 821-825: 'Many of the participants in our study stated that often conflicts arise due to a clear trade-off between two reasonable interests which are conflicting, hence making a \"win–win\" solution unlikely.' Attribution is participant-reported ('participants... stated that'), not an independent authorial finding — brief phrases it accordingly."

  - claim: "On 1,440 simulated places (σ=0.08): frame-aware contested-seam detection precision 1.00 vs frame-blind 0.59; recall 0.82 vs 0.99. (The brief quotes detection only; the v0.5 3-way 0.89 and fixable-vs-irreducible 0.81 accuracies exist in the raw output but are retired from frontstage use post-v0.6 — see the classification-unresolved claim below.)"
    location: "Section 3 (table)"
    source:
      type: file
      ref: "/Users/darrenzal/projects/spore/tmp/sheaf-sensor-sim/participatory_results.txt"
      evidence: "Raw sim output: '80 scenarios x 18 places = 1440 places, sigma=0.08'; 'seam DETECTION ... sheaf P/R = 1.00/0.82 | naive P/R = 0.59/0.99'. (Same file also reports '3-class accuracy: SHEAF = 0.89 | naive = 0.37' and 'fixable-vs-irreducible CLASSIFICATION accuracy: sheaf = 0.81 | naive = 0.57', but those are no longer quoted in the brief.) Generated by participatory_sim.py (deterministic, numpy-only, fair baseline included)."

  - claim: "The lens-aware method catches ~82% of true divergences (detection recall 0.82); that recall is bounded by lens coverage (it misses divergences no stakeholder's vantage point was positioned to see)."
    location: "Section 3 limits + Appendix"
    source:
      type: file
      ref: "/Users/darrenzal/projects/spore/tmp/sheaf-sensor-sim/participatory_results.txt"
      evidence: "Raw sim output: 'sheaf P/R = 1.00/0.82' (recall 0.82). The lens-coverage interpretation of the recall ceiling is established by FINDINGS-v0.6.md (see the v0.6 no-lift claim below); the flattening-harm metric formerly cited here is dropped because it was the classification proxy that v0.6 found unresolved."

  - claim: "On independent measurement errors / single-outlier tasks the lens-aware method offered no advantage over standard robust statistics; its advantage appears specifically on structured (heterogeneous-view) disagreement. v0 static seam-localization recall was overlap-limited (0.23 on independent-fault geometry)."
    location: "Section 3 (honest negative) + Appendix"
    source:
      type: file
      ref: "/Users/darrenzal/projects/spore/tmp/sheaf-sensor-sim/FINDINGS.md"
      evidence: "FINDINGS.md verdict: 'Independent faults (B/C/D): NOT a sheaf-specific win... a per-sensor outlier detector localizes as well or better (0.98 vs 0.85 precision).' and 'Coherent-split obstruction (E/F): ... the sheaf localizes the seam ... precision 0.77 @ Δ=0.6 ... But recall is low (0.23) — inherent to the 1-D overlap.' Backed by results table in same file."

  - claim: "Sheaf/H¹ spectral diagnostics are treated as future work, not a live claim, per the project's deferral discipline (no spectral signal counts until it beats a simpler baseline and the object is typed); no H¹ is computed for this fixture."
    location: "Appendix — discipline boundaries"
    source:
      type: file
      ref: "/Users/darrenzal/projects/spore/tmp/sheaf-sensor-sim/FINDINGS-v0.6.md"
      evidence: "FINDINGS-v0.6.md: 'L2 = δ⁰ with identity restrictions on per-place-estimated values — not a data-dependent H¹ (pinned harmonic extension / nontrivial restrictions = v0.7, only if a phenomenon needs it).' Consistent with the project's deferral discipline (sheaf-experiment-deferral); v0 recall 0.23 corroborates the baseline-first rule."

  - claim: "v0.6 tested spatial aggregation and a place-adjacency cochain; neither lifted detection recall. The recall ceiling (0.82) is within-place observability / lens coverage, not an aggregation problem; a place-adjacency cochain is the wrong base space for intra-place contestation (v0.5's observer-of-a-place sheaf is the right object)."
    location: "Section 3 (boundary) + Appendix discipline boundaries"
    source:
      type: file
      ref: "/Users/darrenzal/projects/spore/tmp/sheaf-sensor-sim/FINDINGS-v0.6.md"
      evidence: "FINDINGS-v0.6.md Gate 1 (TRUSTWORTHY NEGATIVE): L0 per-place recall 0.886/0.842; L1/L2 augmented do not beat L0; 'the recall ceiling is a within-place observability / lens-coverage limit, not an aggregation problem'; at 50 obs/place a place-adjacency cochain still has standalone recall ≈0.004 whereas a within-place cochain gets ≈0.71 — 'the place-adjacency cochain is the wrong base space for an intra-place seam.' participatory_v06_results.txt holds the raw run."

  - claim: "Fixable-vs-irreducible (bridgeable-vs-irreducible) classification is unresolved / implementation-sensitive and is not quoted as a frontstage result; the defensible output is contested-seam detection only. The method surfaces candidate seams for steward review rather than adjudicating which are irreducible."
