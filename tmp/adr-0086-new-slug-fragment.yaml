  - slug: life-value-doctrine
    canonical_label: Life-Value Doctrine
    aliases: [life-value-onto-axiology, life-value-vs-money-value, lvoa-doctrine]
    one_line_definition: >-
      Cross-cutting doctrine admitted under ADR-0086 (Sahely-corpus Bundle α #2 / ADR-X2 per DECISION-BRIEF §17.5 + §17.8 (1)+(4) operator final dispositions) as the fourth member of Spore's cross-cutting-doctrine canon-object-class (sibling to `reproductive-commoning` ADR-0002 + `boundary-commoning` ADR-0003 + `care-commoning` ADR-0045). Doctrine articulation per McMurtry Life-Value Onto-Axiology (LVOA) — value = enablement of range of being / doing / feeling / thinking; lens-over-primitives evaluating whether coordination outcomes serve life-value or money-value (cumulative monetary indicators decoupled from life-coherence). Applies as lens across all nine Spore primitives (field / holon / membrane structural + intent / commitment / joint-commitment / evidence / signal / reproduction verbs) without primitive-elevation — Option C ratified over Option A (10th primitive; fails earning-test (a) — evaluative substrate not coordination operation) and Option B (decompose across primitives; rejected because distributing life-value into property-of-Commitment + lens-on-Evidence + Field-condition reproduces money-value invisibilisation Polanyi names as fictitious-commodity move). Four doctrine-application-domains each anchored to specific Sahely substrate paper — ethics (W2.6 ethics-as-science-of-viability) / economics (W4.1 money-growth-to-life-coherence + Polanyi-substantive-economy) / clinical-policy (W4.3 medicine-of-living-coherence + Sen-Nussbaum-capabilities) / peace (W3.1 toward-life-coherent-peace + life-coherence-at-civilization-scale). Substrate-citation surface per DECISION-BRIEF §17.3 (vii) foundational-triad cite-all rule (UNION-set of 7 bridge notes): W4.2 manifesto CAPSTONE (`spore.connection.sahely-life-value-manifesto`) + W2.3 (`sahely-architecture-of-viability`) + W3.1 (`sahely-toward-life-coherent-peace`) + W4.1 (`sahely-money-growth-to-life-coherence`) + W2.6 (`sahely-ethics-as-science-of-viability`) + W4.3 (`sahely-medicine-of-living-coherence`) + `sahely-ruddick-civil-commons-bridge` (3-layer composition McMurtry → Ruddick → BKC). Cross-tradition cluster-counting per gate (a) honest-rigor (DO NOT inflate): 3 FULL (C1 McMurtry LVOA multi-book multi-decade corpus operationalized across 6 Sahely papers / C2 Polanyi substantive-economy via cross-paper density 12 hits across 5 of 7 notes / C3 Sen-Nussbaum capabilities-approach via W2.6 + W4.3) + 2 PARTIAL (C4 Max-Neef human-scale development / C5 post-growth-Doughnut Raworth-Jackson-Daly-Hickel). C6 Bollier-Helfrich NOT counted as 4th FULL per DECISION-BRIEF §6.2 (C3 includes Civil Commons but is broader). Sequencing predecessor ADR-0085 — `golden-calf-trap` shape + `recursive-audit-method` discipline underwrite life-value evaluation (McMurtry's *Cancer Stage of Capitalism* maps to Golden Calf class-trap at civilizational scale per ADR-0085 three substantive layer-instantiations). ADR-0042 §Consequences narrative-extension folds C4 R-Immanent-ethics; structural-legitimacy gains evaluative substrate (legitimacy of coordination outcomes readable through life-value lens without primitive-grammar extension); frontmatter UNCHANGED per ADR-0050 / ADR-0077 extend-via-prose precedent. Composition with sibling doctrines (lens-intersection without subsumption): reproductive-commoning ↔ life-value-doctrine at reproduction-as-life-value-enablement intersection (reproduction-continuity ADR-0049 verb operates under both lenses); boundary-commoning ↔ life-value-doctrine at life-coherent-boundary discipline (Civil Commons names boundary-set within which life-value is collectively secured); care-commoning ↔ life-value-doctrine at ethics-of-care-as-life-value-enablement layer (care as one mode through which life-value is enabled; doctrines remain distinct — care-commoning relational-discipline, life-value-doctrine evaluative-substrate). Wave-N+1 ic + pm doctrine-reference alignment EXPLICITLY DEFERRED to operator-elective separate-session work per `feedback_workstream_scope_discipline.md` (both H2-decline concepts-p2p-wiki.yaml per ic:ADR-0019 + pm:ADR-0015; propagation will be prose-only doctrine-reference). BKC peer-instance-family bridge candidate (Ruddick-Civil-Commons → BKC commitment-pooling 3-layer composition) preserved as operator-elective separate-session work. Operational-concern match per ADR-0064 PASS — names a specific operational evaluative-substrate (range of being/doing/feeling/thinking enabled by coordination outcomes), not just shared vocabulary. Cross-cutting-doctrine canon-object-class member-count 3 → 4; nine-primitive parsimony preserved; canon object-class inventory PRESERVED at 4 categories. See ADR-0086 §Decision + `docs/research/connections/canon-framing-life-value-doctrine.md` for full doctrine articulation + cross-tradition substrate documentation + four-application-domain operationalization.
